name: Release

# Push a tag matching the version in CMakeLists.txt, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project version
        run: |
          version=$(sed -n 's/^project(IVS_Calc VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpfr-dev libgmp-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            doxygen texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-plain-generic

      - name: Test
        run: make test

      - name: Build package and documentation
        run: |
          make package
          make doc

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/package/*.deb
            build/doc.pdf
